
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123B70">
  <title>WALEN - Offline</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #183153;
      text-align: center;
    }

    .panel {
      width: 100%;
      max-width: 390px;
      padding: 32px 24px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .symbol {
      font-size: 54px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 12px;
      color: #123B70;
    }

    p {
      line-height: 1.6;
      color: #64748b;
    }

    button {
      margin-top: 16px;
      padding: 13px 24px;
      border: 0;
      border-radius: 10px;
      background: #123B70;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="symbol">📡</div>
    <h1>WALEN</h1>
    <h2>Koneksi Internet Terputus</h2>
    <p>
      Sepertinya perangkat Anda sedang offline.
      Silakan periksa koneksi internet, kemudian
      coba buka kembali aplikasi KEWARUNG ONLINE AJA.
    </p>
    <button onclick="window.location.reload()">
      Coba Lagi
    </button>
  </main>
</body>
</html>
